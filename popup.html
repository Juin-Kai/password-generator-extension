<meta charset="utf-8">
<title>Password Generator</title>
<style>
  :root {
    --bg: #14161a; --card: #1c2027; --line: #2c323c;
    --text: #e7eaf0; --dim: #949cab; --accent: #6ea8fe; --err: #ff7b72;
  }
  * { box-sizing: border-box; }
  body {
    font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
    width: 320px; margin: 0; padding: 16px; background: var(--bg); color: var(--text);
  }

  .field {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  #out {
    flex: 1; min-width: 0; border: 0; background: none; color: var(--text);
    font: 600 15px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .5px;
  }

  .icon {
    border: 0; background: none; color: var(--dim); cursor: pointer;
    padding: 4px; border-radius: 6px; line-height: 0;
  }
  .icon:hover { color: var(--text); background: #ffffff14; }
  .icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8;
              stroke-linecap: round; stroke-linejoin: round; }

  .len span { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .len { margin: 16px 0 6px; display: flex; align-items: center; justify-content: space-between; }
  #num {
    width: 58px; text-align: center; padding: 5px; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    font: 600 14px ui-monospace, monospace;
  }
  #num:focus { outline: none; border-color: var(--accent); }

  #len { appearance: none; width: 100%; height: 4px; border-radius: 2px;
         background: var(--line); cursor: pointer; }
  #len::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 0; box-shadow: 0 0 0 4px #6ea8fe26;
  }

  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0; }
  .opt {
    display: flex; align-items: center; gap: 7px; padding: 8px 10px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    font-size: 13px; color: var(--dim); user-select: none;
  }
  .opt:hover { border-color: #3a4250; }
  .wide { grid-column: 1 / -1; }
  .opt input { appearance: none; margin: 0; width: 15px; height: 15px;
               border: 1.5px solid var(--line); border-radius: 4px; cursor: pointer; }
  .opt input:checked { background: var(--accent); border-color: var(--accent); }
  .opt input:checked::after { content: "✓"; display: block; color: #14161a; font-size: 11px;
                              font-weight: 700; text-align: center; line-height: 12px; }
  .opt:has(input:checked) { color: var(--text); border-color: #3c4a63; }

  #regen {
    width: 100%; padding: 10px; border: 0; border-radius: 9px; cursor: pointer;
    background: var(--accent); color: #0e1116; font-size: 14px; font-weight: 600;
  }
  #regen:hover { filter: brightness(1.1); }
  #err { color: var(--err); font-size: 12px; min-height: 16px; margin-top: 8px; text-align: center; }
</style>

<div class="field">
  <input id="out" readonly aria-label="Generated password">
  <button class="icon" id="copy" title="Copy">
    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
  </button>
</div>

<div class="len">
  <span>Length</span>
  <input id="num" type="number" min="6" max="64" value="16" aria-label="Password length">
</div>
<input id="len" type="range" min="6" max="64" value="16" aria-label="Password length slider">

<div class="opts">
  <label class="opt"><input type="checkbox" id="lower" checked> a-z</label>
  <label class="opt"><input type="checkbox" id="upper" checked> A-Z</label>
  <label class="opt"><input type="checkbox" id="digits" checked> 0-9</label>
  <label class="opt"><input type="checkbox" id="symbols" checked> !@#$</label>
  <label class="opt wide"><input type="checkbox" id="nolook"> Avoid look-alikes (l I O 0 1)</label>
</div>

<button id="regen">Generate</button>
<div id="err" role="alert"></div>
<script type="module" src="popup.js"></script>
